# =============================================================================
# InvoicePilot — Netlify Build & Serverless Configuration
# Frontend: Vite Static SPA (dist/client)
# Backend: Netlify Functions (Express API via serverless-http)
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

# Direct API routes to Netlify serverless function
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA client router fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers & Content Security Policy
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api-m.sandbox.paypal.com https://api.sandbox.paypal.com https://generativelanguage.googleapis.com; frame-ancestors 'none';"
